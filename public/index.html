<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UzbekWaifuBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#11111b;--panel:#1d1b2d;--accent:#b68cff;--muted:#aaa4bd}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:8px 0}
    .sub{color:var(--muted);font-size:13px}.wallet{background:linear-gradient(120deg,#7047a8,#352451);padding:18px;border-radius:18px;margin:18px 0}
    .wallet strong{font-size:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card,.stat{background:var(--panel);padding:14px;border-radius:16px;min-width:0}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;background:#302a40}
    .card h3{font-size:14px;margin:9px 0 3px}.tag{font-size:11px;color:var(--accent);text-transform:uppercase}
    button{background:var(--accent);color:#171222;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
    .row{display:flex;gap:10px;margin:16px 0}.stat{flex:1}.stat b{font-size:20px;display:block}
    #cards{margin-top:12px}.error{color:#ff9b9b}
  </style>
</head>
<body>
  <header><div><div class="sub">CHARACTER COLLECTION</div><h1>Harem Games 🎴</h1></div><button onclick="toggleLang()">UZ / EN</button></header>
  <section class="wallet"><div class="sub" id="walletLabel">HAMYONINGIZ</div><strong id="coins">—</strong><div class="sub" id="player">Telegram orqali ochilmoqda…</div></section>
  <div class="row"><div class="stat"><b id="playerCount">—</b><span class="sub">Players</span></div><div class="stat"><b id="cardCount">—</b><span class="sub">Cards collected</span></div></div>
  <h2 id="collectionTitle">Mening kolleksiyam</h2><div id="cards" class="grid"></div><p id="message" class="sub"></p>
  <script>
    const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
    const headers={'x-telegram-init-data':tg?.initData||''};
    let lang='uz';
    function toggleLang(){lang=lang==='uz'?'en':'uz';document.getElementById('walletLabel').textContent=lang==='uz'?'HAMYONINGIZ':'YOUR WALLET';document.getElementById('collectionTitle').textContent=lang==='uz'?'Mening kolleksiyam':'My collection'}
    async function load(){
      try{
        const [me,stats]=await Promise.all([fetch('/api/me',{headers}),fetch('/api/stats').then(r=>r.json())]);
        if(!me.ok)throw new Error((await me.json()).error||'Could not load profile');
        const data=await me.json();
        document.getElementById('coins').textContent=data.user.coins+' 🪙';
        document.getElementById('player').textContent=data.user.name;
        document.getElementById('playerCount').textContent=stats.players;
        document.getElementById('cardCount').textContent=stats.cards;
        const root=document.getElementById('cards');
        if(!data.cards.length){root.innerHTML='<div class="sub">Hozircha kartalar yo‘q. Guruhdagi o‘yinda qatnashing!</div>';return}
        root.innerHTML=data.cards.map(c=>`<article class="card"><img src="${esc(c.image_url||'')}" onerror="this.style.display='none'"><div class="tag">${esc(c.rarity)}</div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.anime)}</div></article>`).join('');
      }catch(e){document.getElementById('message').textContent=e.message;document.getElementById('message').className='error'}
    }
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    load();
  </script>
</body></html>
